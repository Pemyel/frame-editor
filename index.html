<style>

}

[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#f2f2f2;color:#1c1c1c;font-size:12px;padding:3px 7px;border-radius:6px;white-space:nowrap;z-index:20;pointer-events:none;animation:pop .12s}

[data-eye].on{color:var(--fg)}.btn.chip{position:relative;padding-right:34px}.ci{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--mu);display:flex}
