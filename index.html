<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Frame Editor</title>
  <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.css">
  <style>
    :root {
      --ac: #b8f0d4;
      --mu: #9a9a9a;
      --fg: #f2f2f2;
      --bg: #1c1c1c;
      --card: #2c2c2c;
      --b: #111;
      --r: 10px;
      color-scheme: dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      height: 100dvh;
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.4 Inter, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 52px;
      padding: 0 12px;
      border-bottom: 1px solid #111;
      background: #232323;
      box-shadow: inset 0 -1px 0 #ffffff14;
      flex: none;
      overflow-x: auto;
      scrollbar-width: none
    }

    .logo {
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 4px
    }

    .logo i {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      background: conic-gradient(#b8f0d4, #9fd4ff, #c9a0f5, #f0b8d8, #f5e6c8, #b8f0d4);
      box-shadow: 0 0 12px #c9a0f588
    }

    .sp {
      flex: 1
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      min-width: 36px;
      padding: 0 10px;
      border-radius: var(--r);
      border: 1px solid #111;
      background: linear-gradient(180deg, #414040, #2c2c2c);
      box-shadow: inset 0 1px 0 #ffffff40, 0 1px 2px #000a;
      cursor: pointer;
      transition: transform .15s cubic-bezier(0.34, 1.56, 0.64, 1), filter .15s, box-shadow .15s;
      flex: none;
      white-space: nowrap
    }

    .btn:hover {
      filter: brightness(1.12)
    }

    .btn:active {
      transform: scale(.95)
    }

    .btn.on {
      box-shadow: inset 0 2px 6px #000b;
      color: var(--ac)
    }

    .seg {
      display: flex;
      padding: 3px;
      gap: 3px;
      border-radius: 12px;
      background: #181818;
      box-shadow: inset 0 2px 5px #0009;
      flex: none;
      border: 1px solid #111
    }

    .seg button {
      height: 30px;
      padding: 0 13px;
      border: 0;
      border-radius: 9px;
      background: none;
      color: var(--mu);
      cursor: pointer;
      font-weight: 500;
      transition: transform .22s cubic-bezier(0.34, 1.56, 0.64, 1), background .2s, color .2s, box-shadow .2s
    }

    .seg button:hover {
      color: var(--fg)
    }

    .seg button:active {
      transform: scale(.92)
    }

    .seg button.on {
      background: linear-gradient(180deg, #4a4949, #333);
      color: var(--fg);
      box-shadow: inset 0 1px 0 #ffffff40, 0 1px 3px #000a;
      transform: scale(1.02)
    }

    main {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative
    }

    .vp {
      flex: 1;
      position: relative;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center
    }

    .stage {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
      overflow: auto;
      display: grid;
      place-items: center;
      padding: 16px 16px 24px;
      background: #1c1c1c;
      touch-action: none
    }

    .stage.drop {
      outline: 2px dashed var(--ac);
      outline-offset: -10px
    }

    .stage.pip {
      cursor: crosshair !important
    }

    .cw {
      position: relative;
      box-shadow: 0 0 0 1px #111, 0 8px 30px -4px #0008;
      flex: none;
      margin: auto;
      transform-origin: center center;
    }

    .cw.morph {
      transition: width 0.38s cubic-bezier(0.34, 1.35, 0.64, 1), height 0.38s cubic-bezier(0.34, 1.35, 0.64, 1);
      animation: presetSpring 0.4s cubic-bezier(0.34, 1.4, 0.64, 1)
    }

    @keyframes presetSpring {
      0% {
        transform: scale(0.96)
      }

      50% {
        transform: scale(1.018)
      }

      100% {
        transform: scale(1)
      }
    }

    .cw canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block
    }

    .cw canvas.px {
      image-rendering: pixelated
    }

    .cw canvas.ov {
      cursor: move;
      touch-action: none
    }

    .pill {
      flex: none;
      margin: 14px 0 16px;
      display: flex;
      gap: 4px;
      padding: 6px;
      border-radius: 16px;
      background: #2c2c2ce6;
      border: 1px solid #111;
      box-shadow: inset 0 1px 0 #ffffff25, 0 1px 3px #0004, 0 1px 2px -1px #0004;
      backdrop-filter: blur(8px);
      max-width: calc(100% - 16px);
      overflow-x: auto;
      scrollbar-width: none;
      animation: up .3s
    }

    .pill hr {
      width: 1px;
      border: 0;
      background: #111;
      margin: 4px 2px
    }

    .status {
      position: absolute;
      left: 10px;
      top: 8px;
      font: 12px ui-monospace, monospace;
      color: var(--mu);
      pointer-events: none
    }

    aside {
      width: clamp(280px, 25vw, 360px);
      border-left: 1px solid #111;
      background: #232323;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 18px 18px 24px;
      display: grid;
      align-content: start;
      gap: 14px;
      flex: none
    }

    @media(min-width:821px) {
      main.side-left {
        flex-direction: row-reverse
      }

      main.side-left aside {
        border-left: 0;
        border-right: 1px solid #111
      }
    }

    .grp {
      display: grid;
      gap: 8px;
      padding-bottom: 14px;
      border-bottom: 1px solid #111;
      box-shadow: 0 1px 0 #ffffff0d;
      min-width: 0
    }

    .grp:last-child {
      border: 0;
      box-shadow: none
    }

    .gt {
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--mu);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .gh-actions {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .rst-btn {
      height: 22px;
      min-width: 22px;
      padding: 0 5px;
      font-size: 11px;
      border-radius: 6px;
      background: none;
      border: 1px solid transparent;
      box-shadow: none;
      color: var(--mu)
    }

    .rst-btn:hover {
      background: #383838;
      border-color: #111;
      color: var(--fg)
    }

    .r2 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px
    }

    .r3 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.3fr);
      gap: 8px
    }

    .fld {
      position: relative;
      display: flex
    }

    .fld>i:not(.bi) {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-style: normal;
      font-size: 12px;
      color: var(--mu);
      pointer-events: none
    }

    .fld .sw {
      position: absolute;
      left: 7px;
      top: 7px;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 1px solid #111;
      box-shadow: inset 0 1px 0 #fff5;
      cursor: pointer;
      padding: 0
    }

    input[type=text],
    input[type=number],
    select {
      width: 100%;
      height: 40px;
      padding: 0 28px 0 12px;
      background: #1f1f1f;
      border: 1px solid #111;
      border-radius: var(--r);
      box-shadow: inset 0 2px 5px #0009, 0 1px 0 #ffffff12;
      outline: 0;
      transition: .15s;
      min-width: 0
    }

    input.hx {
      padding: 0 10px 0 44px
    }

    input:focus,
    select:focus {
      border-color: #b8f0d4;
      box-shadow: inset 0 2px 5px #0009, 0 0 0 3px #b8f0d433
    }

    .chip {
      height: auto;
      min-height: 42px;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
      padding: 4px 10px;
      font-size: 11px;
      color: var(--mu)
    }

    .chip b {
      color: var(--fg);
      font: 600 13px ui-monospace, monospace
    }

    .pop {
      position: fixed;
      z-index: 9;
      background: #2c2c2c;
      border: 1px solid #111;
      border-radius: 14px;
      padding: 10px;
      display: none;
      gap: 8px;
      box-shadow: 0 20px 50px #000c;
      animation: pop .15s
    }

    .pop.on {
      display: grid
    }

    #sv {
      width: 200px;
      height: 150px;
      border-radius: 8px;
      cursor: crosshair;
      touch-action: none
    }

    #hue {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 14px;
      border-radius: 7px;
      outline: 0;
      background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
      box-shadow: inset 0 1px 3px #0009
    }

    #hue::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #f2f2f2;
      border: 2px solid #111;
      box-shadow: 0 1px 3px #0008
    }

    #hue::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #f2f2f2;
      border: 2px solid #111
    }

    [data-tip] {
      position: relative
    }

    [data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: #f2f2f2;
      color: #1c1c1c;
      font-size: 12px;
      padding: 3px 7px;
      border-radius: 6px;
      white-space: nowrap;
      z-index: 20;
      pointer-events: none;
      animation: pop .12s
    }

    header [data-tip]:hover::after {
      bottom: auto;
      top: calc(100% + 8px)
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      translate: -50% 0;
      white-space: nowrap;
      background: var(--fg);
      color: #1c1c1c;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 600;
      animation: up .2s;
      z-index: 30
    }

    .btn[disabled] {
      opacity: .35;
      pointer-events: none
    }

    .sw2 {
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 9px;
      border: 1px solid #111;
      box-shadow: inset 0 1px 0 #ffffff55, 0 1px 2px #000a;
      cursor: pointer;
      transition: transform .12s
    }

    .sw2:active {
      transform: scale(.92)
    }

    .sw2.on {
      outline: 2px solid #b8f0d4;
      outline-offset: 2px
    }

    .ctx {
      position: fixed;
      z-index: 40;
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      background: #2c2c2cf0;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid #111;
      border-radius: 14px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), inset 0 1px 0 #ffffff25;
      transform-origin: top left;
    }

    .ctx.on {
      display: flex;
      animation: ctxPop 0.26s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards
    }

    .ctx .btn {
      width: 100%;
      justify-content: flex-start;
      gap: 10px;
      height: 38px;
      padding: 0 14px;
      font-size: 13px;
      border-radius: 9px;
      box-shadow: inset 0 1px 0 #ffffff30, 0 1px 2px #000a
    }

    @keyframes ctxPop {
      0% {
        opacity: 0;
        transform: scale(0.8) translateY(-6px)
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0)
      }
    }

    #grab,
    #pillSlot {
      display: none
    }

    #panel {
      display: grid;
      gap: 14px;
      grid-template-columns: minmax(0, 1fr);
      min-width: 0
    }

    [data-eye].on {
      color: var(--fg)
    }

    .btn.chip {
      position: relative;
      padding-right: 34px
    }

    .ci {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--mu);
      display: flex
    }

    .dd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      height: 40px;
      padding: 0 12px;
      background: #1f1f1f;
      border: 1px solid #111;
      border-radius: 10px;
      box-shadow: inset 0 2px 5px #0009, 0 1px 0 #ffffff12;
      cursor: pointer;
      text-align: left;
      transition: .15s
    }

    .dd:hover {
      border-color: #333
    }

    .dd span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    input:disabled,
    .dd:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .ddl {
      position: fixed;
      z-index: 50;
      max-height: 260px;
      background: #282828;
      border: 1px solid #111;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 2px 8px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      display: none
    }

    .ddl.on {
      display: block;
      animation: pop .14s cubic-bezier(0.175, 0.885, 0.32, 1.2)
    }

    .ddl-inner {
      max-height: 258px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 5px;
      scrollbar-width: thin;
      scrollbar-color: #555 transparent
    }

    .ddl-inner::-webkit-scrollbar {
      width: 6px
    }

    .ddl-inner::-webkit-scrollbar-track {
      background: transparent;
      margin: 8px 0
    }

    .ddl-inner::-webkit-scrollbar-thumb {
      background: #4a4a4a;
      border-radius: 999px
    }

    .ddl-inner::-webkit-scrollbar-thumb:hover {
      background: #626262
    }

    .ddl button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      gap: 8px
    }

    .ddl button:hover {
      background: #3a3a3a
    }

    .ddl button.on {
      background: #1f1f1f;
      color: var(--ac)
    }

    .ddl .f-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1
    }

    .f-tags {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: none
    }

    .f-tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: #383838;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: .04em;
      line-height: 1.2
    }

    .f-tag.bold {
      background: #453a25;
      color: #f5d070;
      font-weight: 700
    }

    .f-tag.italic {
      font-style: italic;
      background: #283a45;
      color: #8cc9f5
    }

    .f-tag.regular {
      background: #2a382e;
      color: #a2dbae
    }

    .f-tag.variable {
      background: #3b2a45;
      color: #cca2db
    }

    .f-tag.extra-bold,
    .f-tag.black {
      background: #4a2b25;
      color: #fca582;
      font-weight: 800
    }

    .f-tag.semi-bold {
      background: #3a3825;
      color: #e8d18b
    }

    .f-tag.light,
    .f-tag.thin {
      background: #253745;
      color: #9fd4ff;
      font-weight: 400
    }

    .grip {
      cursor: grab;
      touch-action: none;
      color: #6a6a6a;
      display: inline-flex;
      padding: 4px 6px;
      margin: -4px -6px
    }

    .grip:hover {
      color: var(--fg)
    }

    .lift {
      background: #262626;
      border-radius: 12px;
      box-shadow: 0 0 0 10px #262626, 0 14px 30px -6px #000b;
      position: relative;
      z-index: 3;
      cursor: grabbing;
      will-change: transform;
      opacity: .97
    }

    .lift .grip {
      cursor: grabbing
    }

    .vp>canvas.ov {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
      z-index: 2
    }

    .loupe {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 5px 10px 5px 6px;
      background: #2c2c2cf2;
      border: 1px solid #111;
      border-radius: 20px;
      box-shadow: 0 12px 28px #000c, inset 0 1px 0 #ffffff25;
      backdrop-filter: blur(8px);
      font: 600 12px ui-monospace, monospace;
      color: var(--fg);
      transform: translate(-50%, calc(-100% - 28px));
      transition: transform 0.08s ease-out;
    }

    .loupe.on {
      display: flex
    }

    .loupe-sw {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #0008, inset 0 0 2px #0006;
      flex: none
    }

    .pip-reticle {
      position: fixed;
      pointer-events: none;
      z-index: 101;
      display: none;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
    }

    .pip-reticle.on {
      display: block
    }

    .pip-reticle::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-sizing: border-box;
    }

    .pip-reticle::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 4px;
      background: #ffffff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .bi {
      display: inline-block;
      vertical-align: middle;
      flex: none;
    }

    .btn .bi,
    .pill .bi,
    .ctx .bi,
    .rst-btn .bi {
      width: 17px;
      height: 17px;
    }

    .dd .bi {
      width: 14px;
      height: 14px;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(.96)
      }
    }

    @keyframes up {
      from {
        opacity: 0;
        transform: translateY(8px)
      }
    }

    @media(max-width:820px) {
      main {
        flex-direction: column
      }

      .stage {
        padding: 14px 14px 20px
      }

      .pill {
        padding: 4px;
        margin: 14px 0 calc(14px + env(safe-area-inset-bottom, 0px))
      }

      .status {
        display: none
      }

      aside {
        width: 100%;
        border: 0;
        border-top: 1px solid #111;
        padding: 0;
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -8px 24px #0008;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      #grab,
      #pillSlot {
        display: flex
      }

      #grab {
        height: 30px;
        align-items: center;
        justify-content: center;
        touch-action: none;
        cursor: grab
      }

      #grab i {
        width: 44px;
        height: 5px;
        border-radius: 3px;
        background: #5a5a5a
      }

      #pillSlot {
        justify-content: center;
        padding: 0 max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px))
      }

      #pillSlot .pill {
        margin: 0;
        max-width: 100%
      }

      #panel {
        overflow: auto;
        padding: 6px max(18px, env(safe-area-inset-right, 0px)) calc(60px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
        transition: height .3s cubic-bezier(.2, .9, .25, 1.15);
        overscroll-behavior: contain;
        grid-template-columns: 1fr;
      }

      #panel.min {
        padding: 0
      }

      [data-tip]:hover::after {
        display: none
      }

      .hm {
        display: none
      }

      .logo span {
        display: none
      }

      input[type=text],
      input[type=number],
      select {
        font-size: 16px;
        height: 40px
      }

      .btn {
        min-height: 40px
      }

      header {
        height: 52px
      }
    }

    /* FONTS_CSS_START */
    @font-face {
      font-family: "Activists Regular";
      src: local("Activists Regular"), url("fonts/Activists%20Regular.otf")
    }

    @font-face {
      font-family: "Amaranth Italic";
      src: local("Amaranth Italic"), url("fonts/Amaranth-Italic.ttf")
    }

    @font-face {

      if (m && e.shiftKey && k.toLowerCase() == 'c') { e.preventDefault(); return copyAll() }
      if (m && k.toLowerCase() == 'b') { e.preventDefault(); return setSidePos(sidePos === 'left' ? 'right' : 'left') }
      if (/INPUT|SELECT/.test(e.target.tagName) || m) return;
      const l = L(), s = e.shiftKey, c = k.toLowerCase(), a = { ArrowLeft: ['x', -1], ArrowRight: ['x', 1], ArrowUp: ['y', -1], ArrowDown: ['y', 1] }[k];
      if (c == 'i') return togglePip();
      if (a) { e.preventDefault(); l[a[0]] += a[1] * (s ? 10 : 1) }
      else if (k == '[' || k == '{') l.fs = Math.max(1, l.fs - (s ? 10 : 1));
      else if (k == ']' || k == '}') l.fs += s ? 10 : 1;
      else if (k == ',' || k == '<') l.ang -= s ? 15 : 1;
      else if (k == '.' || k == '>') l.ang += s ? 15 : 1;
      else if (k == '+' || k == '=') return act('zi');
      else if (k == '-') return act('zo');
      else if (k == '0') return fit();
      else {
        const x = { p: 'sel0', n: 'sel1', l: 'al-left', c: 'al-center', r: 'al-right', m: 'mir', u: 'upl' }[c];
        if (c == 'h') l.on = !l.on;
        else if (x) return act(x);
        else return
      }
      render()
    });

    document.fonts.addEventListener('loadingdone', () => render());

    document.addEventListener('paste', e => {
      const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
      if (f) { e.preventDefault(); load(f); toast('Image pasted') }
    });

    const ctxm = document.createElement('div');
    ctxm.className = 'ctx';
    ctxm.innerHTML = `<button class="btn" id="pst">${I(IC.up)}<span>Paste image</span></button><button class="btn" id="rmImgCtx" data-a="rmImg">${I(IC.imgOff)}<span>Reset image</span></button>`;
    document.body.append(ctxm);

    function showCtx(x, y) {
      ctxm.style.left = Math.max(8, Math.min(x - 30, innerWidth - 160)) + 'px';
      ctxm.style.top = Math.max(8, Math.min(y - 30, innerHeight - 110)) + 'px';
      ctxm.classList.remove('on');
      void ctxm.offsetWidth;
      ctxm.classList.add('on');
    }

    $('#pst').onclick = async () => {
      ctxm.classList.remove('on');
      try {
        for (const it of await navigator.clipboard.read()) {
          const ty = it.types.find(t => t.startsWith('image/'));
          if (ty) { load(await it.getType(ty)); return toast('Image pasted') }
        }
        toast('No image in clipboard')
      } catch (e) { toast('Clipboard blocked, use Ctrl+V') }
    };
    $('#rmImgCtx').onclick = () => { ctxm.classList.remove('on'); resetImage() };

    stg.oncontextmenu = e => { e.preventDefault(); showCtx(e.clientX, e.clientY) };
    document.addEventListener('pointerdown', e => { if (!e.target.closest('.ctx')) ctxm.classList.remove('on') });
    new ResizeObserver(() => fit()).observe($('#stage'));

    // Initialize state & mount
    tab = mk('T1');
    setSidePos(sidePos);
    render();
  </script>
