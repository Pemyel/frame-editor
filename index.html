<style>

.cw{position:relative;box-shadow:0 0 0 1px #111,0 4px 16px -2px #0005;animation:pop .3s;flex:none;margin:auto}
.cw canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cw canvas.px{image-rendering:pixelated}.cw canvas.ov{cursor:move;touch-action:none}
.pill{flex:none;margin:14px 0 16px;display:flex;gap:4px;padding:6px;border-radius:16px;background:#2c2c2ce6;border:1px solid #111;box-shadow:inset 0 1px 0 #ffffff25,0 1px 3px #0004,0 1px 2px -1px #0004;backdrop-filter:blur(8px);max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none;animation:up .3s}
.pill hr{width:1px;border:0;background:#111;margin:4px 2px}
.status{position:absolute;left:10px;top:8px;font:12px ui-monospace,monospace;color:var(--mu);pointer-events:none}

.fld .sw{position:absolute;left:7px;top:7px;width:26px;height:26px;border-radius:8px;border:1px solid #111;box-shadow:inset 0 1px 0 #fff5;cursor:pointer;padding:0}

[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#f2f2f2;color:#1c1c1c;font-size:12px;padding:3px 7px;border-radius:6px;white-space:nowrap;z-index:20;pointer-events:none;animation:pop .12s}
header [data-tip]:hover::after{bottom:auto;top:calc(100% + 8px)}

.btn[disabled]{opacity:.35;pointer-events:none}.sw2{width:30px;height:30px;padding:0;border-radius:9px;border:1px solid #111;box-shadow:inset 0 1px 0 #ffffff55,0 1px 2px #000a;cursor:pointer;transition:transform .12s}.sw2:active{transform:scale(.92)}.sw2.on{outline:2px solid #b8f0d4;outline-offset:2px}.ctx{position:fixed;z-index:40;display:none;animation:pop .15s}.ctx.on{display:block}
#grab,#pillSlot{display:none}#panel{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);min-width:0}.grp{min-width:0}
[data-eye].on{color:var(--fg)}.btn.chip{position:relative;padding-right:34px}.ci{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--mu);display:flex}

.vp>canvas.ov{position:absolute;left:0;top:0;pointer-events:none;z-index:2}.stage{touch-action:none}
